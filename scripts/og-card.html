<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;padding:0}
  .card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 82% 22%, rgba(255,255,255,.5), transparent 32%),
      linear-gradient(135deg,#FFE082 0%,#FFC107 55%,#E7AA00 100%);
    font-family:Pretendard,"Noto Sans KR",Inter,system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;justify-content:center;padding:0 92px;
    box-sizing:border-box;
  }
  .mark{
    width:76px;height:76px;border-radius:50%;background:#111;color:#FFC107;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:38px;margin-bottom:34px;
  }
  .brand-en{font-size:66px;font-weight:900;letter-spacing:-.02em;color:#111;margin:0}
  .brand-ko{font-size:28px;font-weight:800;color:#3a2f13;margin:10px 0 0}
  .tagline{font-size:34px;font-weight:700;color:#1c1608;margin:38px 0 0;line-height:1.4;max-width:820px}
  .foot{position:absolute;right:80px;bottom:56px;font-size:20px;font-weight:800;color:#3a2f13;letter-spacing:.04em}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">T</div>
    <p class="brand-en">TOTO CREATIVE</p>
    <p class="brand-ko">토토기획</p>
    <p class="tagline">작은 가게에도 좋은 디자인은<br>필요합니다.</p>
    <div class="foot">luke777-cpu.github.io/toto-creative</div>
  </div>
</body>
</html>
