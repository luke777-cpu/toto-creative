<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가현이 아빠 포인트 챌린지</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff8ef;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#2e2a26}.status{position:sticky;top:0;z-index:20;background:#fff8eff5;border-bottom:1px solid #eadfd3;padding:10px 12px}.in{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.label{font-size:13px;color:#766a61;font-weight:700}.score{font-size:24px;font-weight:900;color:#6d4c35}.meta{font-size:12px;color:#8b7d72}.ok{color:#2e7d32}.reset{border:0;border-radius:10px;padding:9px 11px;background:#f2e5d6;color:#5b3d2b;font-weight:800}iframe{display:block;width:100%;height:calc(100vh - 65px);border:0}</style></head><body><div class="status"><div class="in"><div><div class="label">가현이 공용 저장 점수</div><span id="savedScore" class="score">200P</span> <span id="sync" class="meta">연결 중…</span></div><button id="reset" class="reset">새로 시작</button></div></div><iframe id="game" src="family-challenge-gahyun.html?v=letter2" title="가현이 챌린지"></iframe><script>
const URL='https://xpvffvecdjwkldohuuyl.supabase.co';const KEY='sb_publishable_QWptpKPoqMPtNzYGU_VHDQ_OhPhd8Ca';const PLAYER='박가현';const LOCAL='toto.gahyun.challenge.v2';const frame=document.getElementById('game'),scoreOut=document.getElementById('savedScore'),sync=document.getElementById('sync');
function local(){try{return JSON.parse(localStorage.getItem(LOCAL))||{score:200,finished:false,hints_used:0}}catch(e){return{score:200,finished:false,hints_used:0}}}function render(x){scoreOut.textContent=(x.score??200)+'P';sync.textContent=x.finished?'✓ 최종 점수 공용 저장됨':'✓ 공용 점수판 자동 저장';sync.className='meta ok'}
async function cloudRead(){try{let r=await fetch(URL+'/rest/v1/family_challenge_scores?player=eq.'+encodeURIComponent(PLAYER)+'&select=*',{headers:{apikey:KEY}}),a=await r.json();if(a[0]){localStorage.setItem(LOCAL,JSON.stringify(a[0]));render(a[0]);return a[0]}}catch(e){}sync.textContent='오프라인 저장 중';return local()}
async function cloudSave(p){let x={...local(),...p,player:PLAYER,updated_at:new Date().toISOString()};localStorage.setItem(LOCAL,JSON.stringify(x));render(x);try{let r=await fetch(URL+'/rest/v1/family_challenge_scores?on_conflict=player',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(x)});if(!r.ok)throw 0;sync.textContent=x.finished?'✓ 최종 점수 공용 저장됨':'✓ 공용 점수판 자동 저장'}catch(e){sync.textContent='기기 저장됨 · 공용 동기화 재시도 필요'}return x}
function getScore(doc){let n=parseInt(doc.getElementById('score')?.textContent,10);return Number.isFinite(n)?n:local().score}
const letterHTML=`<h2 style="text-align:center;margin:0 0 24px">큰딸 가현이 — 찔레꽃 같은 아이</h2><div style="font-family:'Nanum Pen Script','Segoe Print','Apple Chancery','Comic Sans MS',cursive;font-size:22px;line-height:1.9;color:#3b3028;max-width:620px;margin:auto;background:#fffdf8;padding:12px 4px"><p>공부 말고는 뭐든 잘하는 가현이.</p><p>아빠가 너를 꽃에 비유한다면, 너는 장미보다는 <b>찔레꽃 같은 아이</b>다.</p><p>화려하고 사람들의 눈길을 한몸에 받는 장미를 좇아가기도 했지만, 이상하게 늘 장미에게 한 발 밀려 있는 것처럼 보였다. 그런데 아빠는 이제 안다. 찔레꽃은 장미가 되지 못한 꽃이 아니라는 것을.</p><p>찔레꽃은 아무 데서나 자라는 것 같아도 제 힘으로 뿌리를 내리고, 누가 돌봐주지 않아도 때가 되면 꽃을 피운다. 화려하지 않아도 오래 바라보면 정이 가고, 가까이 다가가면 자기만의 향기가 있다.</p><p>가현이가 꼭 그렇다.</p><p>어린 시절부터 너는 참 희한한 재주가 있었다. 놀 수 있는 환경이 생기면 괜히 주변 눈치를 보면서 기회를 날리는 아이가 아니었다. 그런 여유와 생존력은 누가 가르친다고 생기는 게 아니다. 타고나는 거다.</p><p>그런데 하필이면 아빠를 닮은 것도 있다. 특히 경제관념까지 아빠 것을 물려받은 것 같아 그게 제일 걱정이다.</p><p>그래도 아빠는 안다. 가현이에게는 <b>지혜로움과 집념</b>이 있다.</p><p>살다 보면 공부 잘하는 것보다 훨씬 중요한 순간들이 온다. 사람을 알아보는 눈, 넘어졌을 때 다시 일어나는 힘, 내가 원하는 것이 무엇인지 알아채는 감각, 그리고 한번 마음먹은 것을 끝까지 붙잡는 힘. 그런 것으로 세상을 살아갔으면 좋겠다.</p><p>이제 서른이 되면 아빠가 너에게 바라는 것도 조금 달라진다.</p><p><b>하고 싶은 일이 있었으면 좋겠다.</b><br>남들이 좋다고 하는 일이 아니라 네가 정말 하고 싶은 일.</p><p><b>갖고 싶은 것도 있었으면 좋겠다.</b><br>그것을 가지려고 땀 흘리고 기다려보기도 했으면 좋겠다.</p><p>그리고 무엇보다 <b>바라고 싶은 것이 있는 사람이었으면 좋겠다.</b></p><p>꼭 성공하지 않아도 된다. 남들보다 앞서가지 않아도 된다.</p><p style="font-size:25px"><b>장미가 되려고 애쓰지 마라.<br>찔레꽃은 찔레꽃으로도 충분히 아름답다.</b></p><p>가현이는 그냥 가현이답게 살았으면 좋겠다.</p><p>아빠가 물려준 좋지 않은 것들은 적당히 버리고, 좋은 것만 골라 가져가라. 그리고 네가 가진 지혜와 집념으로 네 세상을 만들어라.</p><p style="text-align:right;font-weight:800;margin-top:28px">— 아빠가</p></div>`;
(async()=>{let state=await cloudRead();frame.addEventListener('load',()=>{let w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;try{w.eval('s='+Math.max(0,Math.min(200,Number(state.score)||200))+';');d.getElementById('score').textContent=state.score;d.getElementById('fs').textContent=state.score}catch(e){}
[['c1','q1'],['c2','q2'],['c3','q3']].forEach(([card,fn])=>{const b=d.querySelector('#'+card+' button');if(b&&typeof w[fn]==='function'){b.removeAttribute('onclick');b.onclick=e=>{e.preventDefault();w[fn]();};}});
const letter=d.getElementById('letter'),img=letter?.querySelector('img');function showLetter(){if(!letter)return;letter.style.display='block';if(!img||img.complete&&img.naturalWidth===0){letter.innerHTML=letterHTML;}letter.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>{if(img&&img.naturalWidth===0)letter.innerHTML=letterHTML;},300)}if(img)img.addEventListener('error',()=>{if(letter)letter.innerHTML=letterHTML});w.openLetter=showLetter;const lb=d.querySelector('#final button');if(lb){lb.removeAttribute('onclick');lb.onclick=e=>{e.preventDefault();showLetter();};}
let oh=w.hint;if(typeof oh==='function')w.hint=function(i){oh.call(w,i);setTimeout(()=>cloudSave({score:getScore(d),hints_used:(local().hints_used||0)+1,finished:false}),0)};let of=w.finish;if(typeof of==='function')w.finish=function(){of.call(w);setTimeout(()=>cloudSave({score:getScore(d),finished:true}),0)};let se=d.getElementById('score');if(se)new MutationObserver(()=>cloudSave({score:getScore(d)})).observe(se,{childList:true,subtree:true,characterData:true})})})();
document.getElementById('reset').onclick=async()=>{if(!confirm('가현이 점수를 200점으로 초기화할까요?'))return;await cloudSave({score:200,finished:false,hints_used:0});frame.src='family-challenge-gahyun.html?reset='+Date.now()};
</script></body></html>
