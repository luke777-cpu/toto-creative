<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가현이 아빠 포인트 챌린지</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff8ef;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#2e2a26}.status{position:sticky;top:0;z-index:20;background:#fff8eff5;border-bottom:1px solid #eadfd3;padding:10px 12px}.in{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.label{font-size:13px;color:#766a61;font-weight:700}.score{font-size:24px;font-weight:900;color:#6d4c35}.meta{font-size:12px;color:#8b7d72}.ok{color:#2e7d32}.reset{border:0;border-radius:10px;padding:9px 11px;background:#f2e5d6;color:#5b3d2b;font-weight:800}iframe{display:block;width:100%;height:calc(100vh - 65px);border:0}</style></head><body><div class="status"><div class="in"><div><div class="label">가현이 공용 저장 점수</div><span id="savedScore" class="score">200P</span> <span id="sync" class="meta">연결 중…</span></div><button id="reset" class="reset">새로 시작</button></div></div><iframe id="game" src="family-challenge-gahyun-clean.html?v=clean1" title="가현이 챌린지"></iframe><script>const URL='https://xpvffvecdjwkldohuuyl.supabase.co';const KEY='sb_publishable_QWptpKPoqMPtNzYGU_VHDQ_OhPhd8Ca';const PLAYER='박가현';const LOCAL='toto.gahyun.challenge.v2';const frame=document.getElementById('game'),scoreOut=document.getElementById('savedScore'),sync=document.getElementById('sync');function local(){try{return JSON.parse(localStorage.getItem(LOCAL))||{score:200,finished:false,hints_used:0}}catch(e){return{score:200,finished:false,hints_used:0}}}function render(x){scoreOut.textContent=(x.score??200)+'P';sync.textContent=x.finished?'✓ 최종 점수 공용 저장됨':'✓ 공용 점수판 자동 저장';sync.className='meta ok'}async function cloudRead(){try{let r=await fetch(URL+'/rest/v1/family_challenge_scores?player=eq.'+encodeURIComponent(PLAYER)+'&select=*',{headers:{apikey:KEY}}),a=await r.json();if(a[0]){localStorage.setItem(LOCAL,JSON.stringify(a[0]));render(a[0]);return a[0]}}catch(e){}sync.textContent='오프라인 저장 중';return local()}async function cloudSave(p){let x={...local(),...p,player:PLAYER,updated_at:new Date().toISOString()};localStorage.setItem(LOCAL,JSON.stringify(x));render(x);try{let r=await fetch(URL+'/rest/v1/family_challenge_scores?on_conflict=player',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(x)});if(!r.ok)throw 0}catch(e){sync.textContent='기기 저장됨 · 공용 동기화 재시도 필요'}return x}(async()=>{await cloudRead()})();window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!e.data||e.data.type!=='gahyun-score')return;cloudSave({score:e.data.score,finished:!!e.data.finished,hints_used:e.data.hints_used||0})});document.getElementById('reset').onclick=async()=>{if(!confirm('가현이 점수를 200점으로 초기화할까요?'))return;await cloudSave({score:200,finished:false,hints_used:0});frame.src='family-challenge-gahyun-clean.html?v=clean1&reset='+Date.now()};</script></body></html>
