<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 가족 챌린지 점수판</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#2e2a26;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.w{max-width:620px;margin:auto;padding:28px 16px}h1{text-align:center;margin:8px 0}.sub{text-align:center;color:#766a61;margin-bottom:22px}.card{background:#fff;border:1px solid #eadfd3;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 7px 20px #5a3b2210;display:flex;align-items:center;justify-content:space-between}.name{font-size:20px;font-weight:850}.state{font-size:13px;color:#766a61;margin-top:5px}.score{font-size:32px;font-weight:950;color:#6d4c35}.refresh{width:100%;border:0;border-radius:12px;padding:14px;background:#6d4c35;color:white;font-size:16px;font-weight:800;margin-top:16px}.time{text-align:center;font-size:12px;color:#8b7d72;margin-top:12px}</style></head><body><main class="w"><div style="text-align:center">🏆 가족 아빠 포인트</div><h1>우리 가족 점수판</h1><p class="sub">각자 자기 폰으로 도전해도 여기에서 함께 확인할 수 있습니다.</p><div id="list"><div class="card"><div><div class="name">박가현</div><div class="state">불러오는 중…</div></div><div class="score">—</div></div></div><button class="refresh" onclick="load()">↻ 점수 새로고침</button><div id="time" class="time"></div></main><script>const URL='https://xpvffvecdjwkldohuuyl.supabase.co',KEY='sb_publishable_QWptpKPoqMPtNzYGU_VHDQ_OhPhd8Ca';const ORDER=['박가현','박지용','박영현'];async function load(){let box=document.getElementById('list');try{let r=await fetch(URL+'/rest/v1/family_challenge_scores?select=player,score,finished,hints_used,updated_at&order=updated_at.desc',{headers:{apikey:KEY}});if(!r.ok)throw 0;let a=await r.json(),m=Object.fromEntries(a.map(x=>[x.player,x]));box.innerHTML=ORDER.map(n=>{let x=m[n];return `<div class="card"><div><div class="name">${n}</div><div class="state">${x?(x.finished?'도전 완료 ✓':'도전 진행 중'):'아직 도전 전'}</div></div><div class="score">${x?x.score+'P':'—'}</div></div>`}).join('');document.getElementById('time').textContent='마지막 확인 '+new Date().toLocaleString('ko-KR')}catch(e){box.innerHTML='<div class="card"><div><div class="name">점수판 연결 실패</div><div class="state">잠시 후 새로고침해 주세요.</div></div></div>'}}load();setInterval(load,30000);</script></body></html>
